<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <header class="topbar">
        <div id="report-header-text">
            <p>HOSPITAL PORTER OPERATIONS</p>
            <h1>Porter Tracking System</h1>
        </div>
        <nav class="nav-links">
            <a href="History.html">Transport history</a>
            <a href="SignIn.html" id="SignOutLink">Sign out</a>
        </nav>
    </header>

    <main class="report-layout">
    <div class="container">
    <section class="report-form-section">
        <h2>Report</h2>
        <p>Please fill in the necessary information for the report.</p>
        <div class="report-type-toggle" role="report-type-toggle">
          <p>Select Report Type:</p>
          <button type="button" class="toggle-btn active" data-type="Patient">Patient</button>
          <button type="button" class="toggle-btn" data-type="Blood">Blood</button>
        </div>

        <form id="reportForm">
            <label>Porter Name
                <input type="text" id="reportPorterName" name="reportPorterName" required>
            </label>
            <div class="paired-field-row">
                <label for="reportPatientName" id="patientIdentifierLabel"><span id="patientIdentifierText">Patient Name</span>
                    <input type="text" id="reportPatientName" name="reportPatientName" required>
                    <span id="bloodScannerControl" class="blood-scanner" hidden>
                        <button type="button" id="openScanner" class="scan-button">Open camera scanner</button>
                        <output id="scanResult">No specimen scanned</output>
                    </span>
                </label>
                <label for="reportHospitalNumber"> Hospital Number
                    <input type="text" id="reportHospitalNumber" name="reportHospitalNumber" required>
                </label>
            </div>
            <label> Pickup:
                <span class="paired-inputs">
                    <input type="text" id="pickupWard" name="pickupWard" list="wardOptions" placeholder="Enter ward" required>
                    <datalist id="wardOptions">
                        <option value="Emergency"></option>
                        <option value="ICU"></option>
                        <option value="Ward A"></option>
                        <option value="Ward B"></option>
                        <option value="Maternity"></option>
                        <option value="Orthopaedics"></option>
                    </datalist>
                    <input type="time" id="pickupTime" name="pickupTime" required>
                </span>
            </label>
            <label> Drop-off:
                <span class="paired-inputs">
                    <input type="text" id="dropoffWard" name="dropoffWard" list="wardOptions" placeholder="Enter ward" required>
                    <input type="time" id="dropoffTime" name="dropoffTime" required>
                </span>
            </label>
            <label> Feedback
                <textarea id="reportFeedback" name="reportFeedback" rows="4" placeholder="Enter your feedback here..."></textarea>
            </label>
            <div class="report-actions">
                <button type="submit" class="saveReturnBtn" formnovalidate>Save & Return</button>
                <button type="submit" class="submitReportBtn">Submit</button>
            </div>
        </form>
    </section>
    </div>

    <div class="modal scanner-modal" id="scannerModal" role="dialog" aria-modal="true" aria-labelledby="scannerTitle" hidden>
        <div class="modal-content scanner-content">
            <button type="button" class="modal-close" id="closeScanner" aria-label="Close">&times;</button>
            <h2 id="scannerTitle">Scan QR or barcode</h2>
            <p id="scannerStatus">Point the rear camera at a code.</p>
            <video id="scannerVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <aside class="card">
        <h2>Save & Return</h2>
        <ul id="save-return-list" class="save-return-list"></ul>
    </aside>
    </main>
    <script src="Main.js"></script>
</body>
</html>
