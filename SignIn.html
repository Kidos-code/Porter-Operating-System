<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="container">
        <section class="signin-section">
            <h2>Sign In</h2>
            <form id="signinForm">
                <label> Username
                    <input type="text" id="signinUsername" name="signinUsername" required>
                </label>
                <label> Employee Number
                    <input type="text" id="signinEmpNum" name="signinEmpNum" required>
                </label>
                <label> Password
                    <input type="password" id="signinPassword" name="signinPassword" required>
                </label>
                <p class="forgot-password"><a href="#forgotPasswordModal" id="forgotPasswordLink">Forgot password?</a></p>
                <button type="submit" class="signinBtn">Sign in</button>
            </form>

            <p class="registerText">Don't have an account? <a href="index.html">Register</a></p>
        </section>
    </div>

    <!-- This modal verifies the security answer before allowing a password reset. -->
    <div class="modal" id="forgotPasswordModal" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle" hidden>
        <div class="modal-content reset-modal-content">
            <button type="button" class="modal-close" id="closeForgotPassword" aria-label="Close">&times;</button>
            <p class="modal-eyebrow">Account access</p>
            <h2 id="forgotPasswordTitle">Recover your account</h2>
            <p class="modal-intro">Answer your security question to unlock a secure password reset.</p>
            <form id="requestResetForm">
                <label for="recoveryUsername">Username
                    <input type="text" id="recoveryUsername" autocomplete="username" required>
                </label>
                <label for="recoveryEmpNum">Employee number
                    <input type="text" id="recoveryEmpNum" required>
                </label>
                <label for="recoveryQuestion">Security question
                    <select id="recoveryQuestion" required>
                        <option value="">Choose a question</option>
                        <option value="What is your favourite colour?">What is your favourite colour?</option>
                        <option value="What is your mother's name?">What is your mother's name?</option>
                        <option value="What is your favourite food?">What is your favourite food?</option>
                    </select>
                </label>
                <label for="recoveryAnswer">Your answer
                    <input type="text" id="recoveryAnswer" autocomplete="off" required>
                </label>
                <button type="submit" class="reset-submit">Verify my answer</button>
            </form>
            <form id="completeResetForm" hidden>
                <div class="reset-step-note">Your answer was verified. Choose a new password.</div>
                <label for="newPassword">New password
                    <input type="password" id="newPassword" minlength="6" autocomplete="new-password" required>
                </label>
                <label for="confirmNewPassword">Confirm new password
                    <input type="password" id="confirmNewPassword" minlength="6" autocomplete="new-password" required>
                </label>
                <button type="submit" class="reset-submit">Reset password</button>
            </form>
        </div>
    </div>

    <script src="Main.js"></script>
</body>
</html>
