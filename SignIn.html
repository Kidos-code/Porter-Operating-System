<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="container">
        <section class="signin-section">
            <h2>Sign In</h2>
            <form id="signinForm">
                <label> Username
                    <input type="text" id="signinUsername" name="signinUsername" required>
                </label>
                <label> Employee Number
                    <input type="text" id="signinEmpNum" name="signinEmpNum" required>
                </label>
                <label> Password
                    <input type="password" id="signinPassword" name="signinPassword" required>
                </label>
                <p class="forgot-password"><a href="#forgotPasswordModal" id="forgotPasswordLink">Forgot password?</a></p>
                <button type="submit" class="signinBtn">Sign in</button>
            </form>

            <p class="registerText">Don't have an account? <a href="Index.html">Register</a></p>
        </section>
    </div>

    <!-- This modal keeps the reset-code workflow on the sign-in page. -->
    <div class="modal" id="forgotPasswordModal" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle" hidden>
        <div class="modal-content">
            <button type="button" class="modal-close" id="closeForgotPassword" aria-label="Close">&times;</button>
            <h2 id="forgotPasswordTitle">Reset your password</h2>
            <form id="requestResetForm">
                <label> Email
                    <input type="email" id="resetEmail" required>
                </label>
                <button type="submit">Send reset code</button>
            </form>
            <form id="completeResetForm" hidden>
                <label> Reset code
                    <input type="text" id="resetCode" inputmode="numeric" required>
                </label>
                <label> New password
                    <input type="password" id="newPassword" minlength="6" required>
                </label>
                <button type="submit">Reset password</button>
            </form>
        </div>
    </div>

    <script src="Main.js"></script>
</body>
</html>
