<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="container">
        <section class="signin-section">
            <h2>Sign In</h2>
            <form id="signinForm">
                <label> Username
                    <input type="text" id="signinUsername" name="signinUsername" required>
                </label>
                <label> Employee Number
                    <input type="text" id="signinEmpNum" name="signinEmpNum" required>
                </label>
                <label> Password
                    <input type="password" id="signinPassword" name="signinPassword" required>
                </label>
                <button type="submit" class="signinBtn">Sign in</button>
            </form>

            <p class="registerText">Don't have an account? <a href="Register.html">Register</a></p>
        </section>
    </div>

    <script src="Main.js"></script>
</body>
</html>
