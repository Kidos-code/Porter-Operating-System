<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="container">
        <section class="signin-section">
            <h2>Sign In</h2>
            <form id="signinForm">
                <label> Username
                    <input type="text" id="signinUsername" name="signinUsername" required>
                </label>
                <label> Employee Number
                    <input type="text" id="signinEmpNum" name="signinEmpNum" required>
                </label>
                <label> Password
                    <input type="password" id="signinPassword" name="signinPassword" required>
                </label>
                <p class="forgot-password"><a href="#forgotPasswordModal" id="forgotPasswordLink">Forgot password?</a></p>
                <button type="submit" class="signinBtn">Sign in</button>
            </form>

            <p class="registerText">Don't have an account? <a href="Index.html">Register</a></p>
        </section>
    </div>

    <!-- This modal keeps the reset-code workflow on the sign-in page. -->
    <div class="modal" id="forgotPasswordModal" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle" hidden>
        <div class="modal-content reset-modal-content">
            <button type="button" class="modal-close" id="closeForgotPassword" aria-label="Close">&times;</button>
            <p class="modal-eyebrow">Account access</p>
            <h2 id="forgotPasswordTitle">Reset your password</h2>
            <p class="modal-intro">We will email you a secure reset code to verify your account.</p>
            <form id="requestResetForm">
                <label for="resetEmail">Email address
                    <input type="email" id="resetEmail" autocomplete="email" required>
                </label>
                <button type="submit" class="reset-submit">Email me a reset code</button>
            </form>
            <form id="completeResetForm" hidden>
                <div class="reset-step-note">Check your inbox for the six-digit code.</div>
                <label for="resetCode">Reset code
                    <input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" required>
                </label>
                <label for="newPassword">New password
                    <input type="password" id="newPassword" minlength="6" autocomplete="new-password" required>
                </label>
                <button type="submit" class="reset-submit">Set new password</button>
            </form>
        </div>
    </div>

    <script>
        window.EMAILJS_CONFIG = {
            publicKey: "YOUR_EMAILJS_PUBLIC_KEY",
            serviceId: "YOUR_EMAILJS_SERVICE_ID",
            templateId: "YOUR_EMAILJS_TEMPLATE_ID"
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="Main.js"></script>
</body>
</html>
