<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports History</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <header class="topbar">
        <div>
            <p>HOSPITAL PORTER OPERATIONS</p>
            <h1>Porter Tracking System</h1>
        </div>
        <nav class="nav-links">

        <h2>Transport History</h2>
